# ==========================================
# 🐳 图床服务 - 完整启动（前后端）
# ==========================================
# 使用方法:
#   docker-compose up -d --build
# ==========================================

services:
  # ==========================================
  # 🚀 图床服务后端
  # ==========================================
  tuchuang:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: tuchuang_server
    restart: unless-stopped

    # 端口映射 (宿主端口在 .env 中配置 APP_PORT)
    ports:
      - "${APP_PORT:-8000}:8000"

    # 数据卷挂载 (持久化数据)
    volumes:
      - ./uploads:/app/uploads          # 本地存储目录
      - tuchuang_db:/app/data           # 数据目录（使用命名卷避免文件/目录冲突）
      - ./logs:/app/logs                # 日志目录
      - ./.env:/app/.env                # 应用配置 (admin 后台可修改, 原地写入同步到宿主)

    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 🎨 管理后台前端
  # ==========================================
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: tuchuang_admin
    restart: unless-stopped

    # 端口映射 (宿主端口在 .env 中配置 ADMIN_PORT)
    ports:
      - "${ADMIN_PORT:-3000}:3000"

    # 环境变量
    # ⚠️ NEXT_PUBLIC_* 会内联进浏览器代码,必须是对外可访问的地址,不能用容器服务名
    environment:
      - NEXT_PUBLIC_API_URL=${HOST_DOMAIN:-http://127.0.0.1:8000}
      - NEXT_PUBLIC_API_KEY=${API_KEY:-}

    # 依赖后端服务
    depends_on:
      - tuchuang

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 📊 Prometheus (可选监控)
  # ==========================================
  # 取消注释以启用 Prometheus 监控
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: tuchuang_prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #   depends_on:
  #     - tuchuang

  # ==========================================
  # 🔴 Redis (可选分布式限流)
  # ==========================================
  # 取消注释以启用 Redis 分布式限流
  # redis:
  #   image: redis:7-alpine
  #   container_name: tuchuang_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

# 持久化数据卷
volumes:
  tuchuang_db:                    # 数据库命名卷
    driver: local
  # redis_data:                   # Redis 卷（启用时取消注释）
