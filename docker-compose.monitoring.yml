# ==========================================
# 🐳 图床服务 - 监控服务（Prometheus + Grafana）
# ==========================================
# 使用方法:
#   docker-compose -f docker-compose.monitoring.yml up -d
# ==========================================

services:
  # ==========================================
  # 📊 Prometheus - 监控数据采集
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tuchuang_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    # tuchuang 解析到宿主机 (systemd 模式下后端不在 Docker 网络中;
    # Docker 模式下服务名优先,不影响容器间直连)
    extra_hosts:
      - "tuchuang:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    # 跨文件无法 depends_on,由 deploy.sh 保证后端先启动

  # ==========================================
  # 📈 Grafana - 监控可视化
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: tuchuang_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    depends_on:
      - prometheus

  # ==========================================
  # 🚀 图床服务后端（如果需要一起启动）
  # ==========================================
  # 取消注释以下内容可同时启动后端服务
  # tuchuang:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.backend
  #   container_name: tuchuang_server
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./uploads:/app/uploads
  #     - tuchuang_db:/app/data
  #     - ./logs:/app/logs
  #   networks:
  #     - tuchuang_network

# 数据卷
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

